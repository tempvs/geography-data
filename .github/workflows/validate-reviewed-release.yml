name: Validate reviewed geography release

on:
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "data/releases/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-reviewed-release.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "config/**"
      - "data/releases/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-reviewed-release.yml"

permissions:
  contents: read

jobs:
  validate-reviewed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run geo -- release:verify data/releases/dev-pilot-v1
